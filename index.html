<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <meta name="description" content="A focused, keyboard-friendly calculator with calculation history and light and dark themes.">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (() => {
      const root = document.documentElement;
      let theme = null;
      try { theme = localStorage.getItem('calculator-theme'); } catch (_) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      root.dataset.theme = theme;
      if (window.matchMedia('(min-width: 861px)').matches) {
        root.classList.add('history-open');
      }
    })();
  </script>
</head>
<body>
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>

  <main class="stage">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="brand-name">Calculator</span>
        </div>

        <div class="tools">
          <button
            class="icon-button"
            id="history-toggle"
            type="button"
            aria-label="Show calculation history"
            aria-controls="history-panel"
            aria-expanded="false"
            title="History"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 2.63-6.36L3 8.27"></path>
              <path d="M3 3.5v4.77h4.77"></path>
              <path d="M12 7.5v5l3.1 1.8"></path>
            </svg>
            <span class="unread-dot" id="history-dot" aria-hidden="true"></span>
          </button>

          <button
            class="icon-button"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
            title="Switch theme"
          >
            <svg class="icon icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
            <svg class="icon icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5 8.6 8.6 0 1 0 20.5 14.4Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="display">
        <div class="display-top">
          <div class="expression" id="expression" aria-hidden="true">&nbsp;</div>
          <button class="backspace-button" id="backspace" type="button" aria-label="Backspace" title="Backspace">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7 6-7Z"></path>
              <path d="m12 9 6 6M18 9l-6 6"></path>
            </svg>
          </button>
        </div>
        <output class="result" id="result" data-size="lg" aria-live="polite">0</output>
      </section>

      <div class="keys" id="keys">
        <button class="key key--function" type="button" data-action="clear" aria-label="All clear">AC</button>
        <button class="key key--function" type="button" data-action="sign" aria-label="Toggle positive or negative">±</button>
        <button class="key key--function" type="button" data-action="percent" aria-label="Percent">%</button>
        <button class="key key--operator" type="button" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

        <button class="key" type="button" data-action="digit" data-value="7">7</button>
        <button class="key" type="button" data-action="digit" data-value="8">8</button>
        <button class="key" type="button" data-action="digit" data-value="9">9</button>
        <button class="key key--operator" type="button" data-action="operator" data-value="×" aria-label="Multiply">×</button>

        <button class="key" type="button" data-action="digit" data-value="4">4</button>
        <button class="key" type="button" data-action="digit" data-value="5">5</button>
        <button class="key" type="button" data-action="digit" data-value="6">6</button>
        <button class="key key--operator" type="button" data-action="operator" data-value="−" aria-label="Subtract">−</button>

        <button class="key" type="button" data-action="digit" data-value="1">1</button>
        <button class="key" type="button" data-action="digit" data-value="2">2</button>
        <button class="key" type="button" data-action="digit" data-value="3">3</button>
        <button class="key key--operator" type="button" data-action="operator" data-value="+" aria-label="Add">+</button>

        <button class="key key--zero" type="button" data-action="digit" data-value="0">0</button>
        <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key key--equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </div>

      <footer class="keyboard-hint" aria-hidden="true">
        <span><kbd>Enter</kbd> equals</span>
        <span><kbd>Esc</kbd> clear</span>
      </footer>
    </section>

    <aside class="history-card" id="history-panel" aria-labelledby="history-title">
      <div class="history-header">
        <div>
          <span class="history-kicker">This session</span>
          <h2 class="history-title" id="history-title">
            History
            <span class="history-count" id="history-count" hidden>0</span>
          </h2>
        </div>
        <button class="text-button" id="clear-history" type="button">Clear</button>
      </div>

      <div class="history-list" id="history-list" role="list"></div>

      <div class="history-empty" id="history-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"></circle>
          <path d="M12 7.5V12l3 2"></path>
        </svg>
        <p>Nothing here yet</p>
        <span>Your calculations will be saved here.</span>
      </div>

      <div class="history-tip">
        <span class="history-tip-label">Tip</span>
        Click any result to reuse it.
      </div>
    </aside>
  </main>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
